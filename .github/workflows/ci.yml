name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Testes (motor + UI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # histórico completo: a checagem do sw.js precisa do SHA base do diff
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Dependências
        run: npm ci

      # Falha ANTES da suíte se o Service Worker não compilar (um SyntaxError no sw.js
      # derruba o app offline inteiro) e se algum arquivo do cache não existir no repo.
      - name: Service Worker — sintaxe e arquivos do CORE
        run: |
          node --check sw.js
          npm run check:sw-core

      - name: Testes (motor + UI + Service Worker)
        run: npm test

      # O jsdom não executa type="module": esta checagem linka e avalia o
      # grafo REAL de ES modules em Node (import quebrado quebra aqui).
      - name: Grafo de ES modules (link + avaliação)
        run: npm run check:modules

      # Docs/comentários não podem apontar para linha/seção dos runners finos
      # (test_engine.js/test_ui.js) nem para tests/<área>/*.js inexistente.
      - name: Ponteiros de teste em docs e comentários
        run: npm run check:docs

  build-css:
    name: vendor/tailwind.css atualizado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Dependências
        run: npm ci

      # Falha se o CSS commitado estiver diferente do gerado a partir das
      # classes usadas em index.html e js/** (evita classe nova sem build).
      - name: Build do CSS e comparação
        run: |
          npm run build:css
          if ! git diff --exit-code -- vendor/tailwind.css; then
            echo "❌ vendor/tailwind.css está desatualizado."
            echo "   Rode 'npm run build:css' e commite o resultado."
            exit 1
          fi
          echo "✅ vendor/tailwind.css em dia com as classes do app."

  cache-offline:
    name: Versão do cache offline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Se o PR mexeu em js/** ou images/**, o VERSION do sw.js tem que subir —
      # senão quem já tem o app instalado continua servindo o bundle velho offline.
      - name: sw.js VERSION incrementado
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-sw-version.js "$BASE_SHA"

  # Valida o MESMO artefato que o Pages vai publicar: se um arquivo do CORE não estiver
  # no _site, o cache offline falha na instalação em produção.
  pages-artefato:
    name: Artefato do GitHub Pages contém o CORE do Service Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Monta _site (mesmo script do pages.yml)
        run: bash scripts/build-site.sh _site

      - name: Verifica sw.js e CORE contra o _site
        run: |
          node --check _site/sw.js
          node scripts/check-sw.js _site

  # Gate em navegador real (Chrome do runner): boot em módulos ES, Service Worker,
  # IndexedDB, downloads, layout e fluxos principais. Sem Chrome, o job deve falhar;
  # não é permitido aprovar a CI com a validação pulada.
  navegador:
    name: Validação em navegador real
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Dependências
        run: npm ci

      # Só o driver (playwright-core não baixa navegador) e SEM tocar no package.json
      # nem no package-lock.json: não vira dependência do projeto.
      - name: Driver do navegador (playwright-core, --no-save)
        run: |
          npm i --no-save --no-audit --no-fund playwright-core
          git diff --exit-code -- package.json package-lock.json

      - name: Chrome do runner
        id: chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$CHROME" ]; then "$CHROME" --version; else echo "::warning::Chrome não encontrado na imagem do runner"; fi
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"

      - name: Validação em navegador real
        env:
          DIARIO_CHROME_PATH: ${{ steps.chrome.outputs.path }}
          DIARIO_EXIGIR_NAVEGADOR: '1'
          DIARIO_REPORT: ${{ runner.temp }}/validacao-navegador.json
        run: node scripts/validacao-navegador.js

      - name: Relatório da validação
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validacao-navegador
          path: ${{ runner.temp }}/validacao-navegador.json
          if-no-files-found: ignore
