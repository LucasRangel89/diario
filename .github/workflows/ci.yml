name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Testes (motor + UI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # histórico completo: a checagem do sw.js precisa do SHA base do diff
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Testes (test_engine.js + test_ui.js)
        run: npm test

  build-css:
    name: vendor/tailwind.css atualizado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: npm ci

      # Falha se o CSS commitado estiver diferente do gerado a partir das
      # classes usadas em index.html e js/** (evita classe nova sem build).
      - name: Build do CSS e comparação
        run: |
          npm run build:css
          if ! git diff --exit-code -- vendor/tailwind.css; then
            echo "❌ vendor/tailwind.css está desatualizado."
            echo "   Rode 'npm run build:css' e commite o resultado."
            exit 1
          fi
          echo "✅ vendor/tailwind.css em dia com as classes do app."

  cache-offline:
    name: Versão do cache offline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Se o PR mexeu em js/** ou images/**, o VERSION do sw.js tem que subir —
      # senão quem já tem o app instalado continua servindo o bundle velho offline.
      - name: sw.js VERSION incrementado
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-sw-version.js "$BASE_SHA"
